name: validation
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: gasdynbench --quick --output results/ci
      - run: gasdynbench-highdim --quick --output results/highdim-ci
      - run: OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=src python scripts/run_application_audits.py --quick --output results/application-ci --latex-output /tmp/generated_timing_values.tex
      - run: python scripts/validate_release.py
