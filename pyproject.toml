[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gasdynbench"
version = "0.1.0"
description = "Reproducible physics-guided neural benchmarks for canonical gas dynamics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ehsan Roohi", email = "roohie@umass.edu"}]
dependencies = [
  "numpy==2.3.5",
  "scipy==1.17.0",
  "scikit-learn==1.8.0",
  "pandas==2.2.3",
  "matplotlib==3.10.8",
  "joblib==1.5.2",
]

[project.scripts]
gasdynbench = "gasdynbench.run_revision:main"
gasdynbench-highdim = "gasdynbench.high_dimensional_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
